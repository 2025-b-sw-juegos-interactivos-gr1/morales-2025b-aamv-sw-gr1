<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Examen 1B: Taxi Clásico</title>
    <style>
      html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; }
      #renderCanvas { width: 100%; height: 100%; touch-action: none; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <script>
      const canvas = document.getElementById("renderCanvas");
      const engine = new BABYLON.Engine(canvas, true);

      const createScene = async function () {
        const scene = new BABYLON.Scene(engine);

        // =========================================================
        // 1. CONFIGURACIÓN DEL ENTORNO Y FISICAS
        // =========================================================
        
        // ACTIVAMOS LAS COLISIONES EN EL MUNDO
        scene.collisionsEnabled = true; 

        // Configuración de Noche y Neblina
        const colorNoche = new BABYLON.Color3(0.05, 0.05, 0.2);
        scene.clearColor = colorNoche;
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP; 
        scene.fogColor = colorNoche; 
        scene.fogDensity = 0.02; 

        // Iluminación 
        const luzAmbiente = new BABYLON.HemisphericLight("luzAmbiente", new BABYLON.Vector3(0, 1, 0), scene);
        luzAmbiente.diffuse = new BABYLON.Color3(0.2, 0.2, 0.5); 
        luzAmbiente.intensity = 0.4; 

        const luna = new BABYLON.DirectionalLight("luna", new BABYLON.Vector3(-1, -2, -1), scene);
        luna.position = new BABYLON.Vector3(20, 40, 20);
        luna.intensity = 1.2; 

        // =========================================================
        // 2. SISTEMA DE AUDIO (HTML5)
        // =========================================================
        const musicaHTML = new Audio('./sounds/musica.mp3');
        musicaHTML.loop = true;   
        musicaHTML.volume = 0.01;  

        // Manejo de bloqueo de Autoplay del navegador
        const promesaPlay = musicaHTML.play();
        if (promesaPlay !== undefined) {
            promesaPlay.catch(error => {
                console.log("Esperando interacción para audio...");
                const desbloquearAudio = () => {
                    musicaHTML.play();
                    window.removeEventListener("click", desbloquearAudio);
                    window.removeEventListener("keydown", desbloquearAudio);
                };
                window.addEventListener("click", desbloquearAudio);
                window.addEventListener("keydown", desbloquearAudio);
            });
        }
        
        // =========================================================
        // 3. BASE DE DATOS DE PASAJEROS
        // =========================================================
        let configPasajeros = [
            {
                id: 0,
                archivoModelo: "persona_A.glb", 
                posicionInicial: new BABYLON.Vector3(10, 0.5, -6),
                posicionDestino: new BABYLON.Vector3(9,5, -100),
                colorZona: new BABYLON.Color3(0, 0.5, 1), // AZUL
                rotacionInicial: -90,
                mesh: null, zonaMesh: null, entregado: false
            },
            {
                id: 1,
                archivoModelo: "persona_B.glb",
                posicionInicial: new BABYLON.Vector3(-10, 0.5, -132),
                posicionDestino: new BABYLON.Vector3(-9,5,-69.5),
                colorZona: new BABYLON.Color3(1, 0, 0), // ROJO
                rotacionInicial: 90,
                mesh: null, zonaMesh: null, entregado: false
            }
        ];

        // Variables de Estado del Juego
        let contadorEntregas = 0;
        const totalPasajeros = configPasajeros.length;
        let juegoTerminado = false; 

        // =========================================================
        // 4. INTERFAZ DE USUARIO 
        // =========================================================
        const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

        // Panel A: Instrucciones
        const panelInstrucciones = new BABYLON.GUI.Rectangle();
        panelInstrucciones.width = "300px"; panelInstrucciones.height = "140px";
        panelInstrucciones.cornerRadius = 10; panelInstrucciones.color = "cyan";
        panelInstrucciones.thickness = 2; panelInstrucciones.background = "rgba(0, 0, 0, 0.7)";
        panelInstrucciones.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
        panelInstrucciones.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
        panelInstrucciones.left = "20px"; panelInstrucciones.top = "20px";
        advancedTexture.addControl(panelInstrucciones);

        const textoInstrucciones = new BABYLON.GUI.TextBlock();
        textoInstrucciones.text = "🚕 CONTROLES\n\nW,A,S,D: Moverse\nEspacio: Acción\nMouse: Cámara";
        textoInstrucciones.color = "white"; textoInstrucciones.fontSize = 18;
        panelInstrucciones.addControl(textoInstrucciones); 

        // Panel B: Contador de Pasajeros
        const panelContador = new BABYLON.GUI.Rectangle();
        panelContador.width = "250px"; panelContador.height = "80px";
        panelContador.cornerRadius = 10; panelContador.color = "yellow"; 
        panelContador.thickness = 2; panelContador.background = "rgba(0, 0, 0, 0.7)";
        panelContador.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_RIGHT; 
        panelContador.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_TOP;
        panelContador.left = "-20px"; panelContador.top = "20px";
        advancedTexture.addControl(panelContador);

        const textoContador = new BABYLON.GUI.TextBlock();
        textoContador.text = `PASAJEROS\n${contadorEntregas} / ${totalPasajeros}`;
        textoContador.color = "yellow"; textoContador.fontSize = 24; textoContador.fontWeight = "bold";
        panelContador.addControl(textoContador);

        // Panel C: Pantalla de Victoria (Oculta)
        const pantallaVictoria = new BABYLON.GUI.Rectangle();
        pantallaVictoria.width = 1; pantallaVictoria.height = 1; 
        pantallaVictoria.background = "rgba(0, 0, 0, 0.85)"; pantallaVictoria.isVisible = false; 
        pantallaVictoria.zIndex = 10; 
        advancedTexture.addControl(pantallaVictoria);

        const textoVictoria = new BABYLON.GUI.TextBlock();
        textoVictoria.text = "🏆 ¡MISIÓN COMPLETADA! 🏆\n\nPresiona 'R' para reiniciar";
        textoVictoria.color = "#00ff00"; textoVictoria.fontSize = 48; textoVictoria.fontWeight = "bold";
        pantallaVictoria.addControl(textoVictoria);

        // Capa de Resaltado (Glow Effect)
        const highlightLayer = new BABYLON.HighlightLayer("hl1", scene);
        highlightLayer.blurHorizontalSize = 1; highlightLayer.blurVerticalSize = 1;

        // Cámara de Seguimiento
        const camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 5, -10), scene);
        camera.setTarget(BABYLON.Vector3.Zero());
        camera.attachControl(canvas, true);
        camera.inputs.remove(camera.inputs.attached.keyboard);
        camera.angularSensibility = 2000;

        // =========================================================
        // 5. CARGA DE MODELOS Y COLISIONES
        // =========================================================

        // A. Cargar Vecindario y hacerlo Sólido
        const importVecindario = await BABYLON.SceneLoader.ImportMeshAsync("", "./models/", "vecindario.glb", scene);
        importVecindario.meshes.forEach(mesh => {
            mesh.checkCollisions = true; 
        });

        // B. Cargar Taxi y definir su Cuerpo Físico
        const importTaxi = await BABYLON.SceneLoader.ImportMeshAsync("", "./models/", "taxi.glb", scene);
        const taxi = importTaxi.meshes[0];
        taxi.rotationQuaternion = null;
        taxi.rotation.y = BABYLON.Tools.ToRadians(180);
        taxi.position = new BABYLON.Vector3(0, 4.5, 0);
        taxi.scaling = new BABYLON.Vector3(1, 1, 1);
        
        // Configuración de Colisión del Taxi
        taxi.checkCollisions = true;
        taxi.ellipsoid = new BABYLON.Vector3(1.5, 1.0, 3.0); 

        camera.parent = taxi;

        // C. Efecto de Haz de Luz
        const hazLuz = BABYLON.MeshBuilder.CreateCylinder("hazLuz", {
            height: 5, diameterTop: 0.5, diameterBottom: 10, tessellation: 16
        }, scene);
        const materialHaz = new BABYLON.StandardMaterial("matHaz", scene);
        materialHaz.diffuseColor = new BABYLON.Color3(1, 1, 1);
        materialHaz.emissiveColor = new BABYLON.Color3(1, 1, 1);
        materialHaz.alpha = 0.4;
        hazLuz.material = materialHaz;
        hazLuz.parent = taxi;
        hazLuz.position = new BABYLON.Vector3(0, -3, 0);
        hazLuz.isVisible = false;

        // D. Cargar Pasajeros 
        for (let i = 0; i < configPasajeros.length; i++) {
            let pData = configPasajeros[i];
            try {
                // Carga del modelo 3D
                const importResult = await BABYLON.SceneLoader.ImportMeshAsync("", "./models/", pData.archivoModelo, scene);
                pData.mesh = importResult.meshes[0];
                pData.mesh.scaling = new BABYLON.Vector3(0.75, 0.75, 0.75);
                pData.mesh.position = pData.posicionInicial;
                pData.mesh.rotationQuaternion = null;
                pData.mesh.rotation.y = BABYLON.Tools.ToRadians(pData.rotacionInicial);
                
                // Aplicar brillo al contorno
                importResult.meshes.forEach(meshPart => {
                    if (meshPart.name !== "__root__") {
                        highlightLayer.addMesh(meshPart, pData.colorZona);
                    }
                });
            } catch (error) {
                console.error("Error cargando modelo");
                continue;
            }

            // Crear Zona de Entrega 
            const nuevaZona = BABYLON.MeshBuilder.CreateCylinder("zona_" + i, { diameter: 5, height: 10 }, scene);
            nuevaZona.position = pData.posicionDestino;
            const matZona = new BABYLON.StandardMaterial("matZona_" + i, scene);
            matZona.diffuseColor = pData.colorZona;
            matZona.emissiveColor = pData.colorZona; 
            matZona.alpha = 0.3;
            nuevaZona.material = matZona; 
            pData.zonaMesh = nuevaZona;   
        }

        // Animación de Zonas
        scene.registerBeforeRender(() => {
             const alphaValue = 0.3 + Math.sin(Date.now() / 500) * 0.1;
             configPasajeros.forEach(pData => {
                if(pData.zonaMesh) {
                    pData.zonaMesh.rotation.y += 0.02;
                    pData.zonaMesh.material.alpha = alphaValue;
                }
             });
        });

        // =========================================================
        // 6. CONTROL DE INPUTS 
        // =========================================================
        let inputMap = {};
        scene.onKeyboardObservable.add((kbInfo) => {
          switch (kbInfo.type) {
            case BABYLON.KeyboardEventTypes.KEYDOWN: 
                // Reinicio con tecla 'R'
                if (juegoTerminado && kbInfo.event.key.toLowerCase() === 'r') {
                    location.reload(); 
                }
                inputMap[kbInfo.event.key.toLowerCase()] = true; 
                break;
            case BABYLON.KeyboardEventTypes.KEYUP: 
                inputMap[kbInfo.event.key.toLowerCase()] = false; 
                break;
          }
        });

        // =========================================================
        // 7. LÓGICA DEL BUCLE DE JUEGO
        // =========================================================
        let pasajeroActualIdx = null; 
        const velocidad = 0.3; 

        scene.onBeforeRenderObservable.add(() => {
                if (juegoTerminado) return; // Pausar si ganó

                // Sincronizar giro de cámara con Taxi
                if (camera.rotation.y !== 0) {
                    taxi.rotation.y += camera.rotation.y;
                    camera.rotation.y = 0; 
                }

                // CALCULO DE MOVIMIENTO CON FÍSICAS
                let movimientoVector = new BABYLON.Vector3(0, 0, 0);

                if (inputMap["w"]) {
                    let forward = taxi.getDirection(BABYLON.Axis.Z).scale(velocidad);
                    movimientoVector = movimientoVector.add(forward);
                }
                if (inputMap["s"]) {
                    let backward = taxi.getDirection(BABYLON.Axis.Z).scale(-velocidad);
                    movimientoVector = movimientoVector.add(backward);
                }
                if (inputMap["a"]) {
                    let left = taxi.getDirection(BABYLON.Axis.X).scale(-velocidad);
                    movimientoVector = movimientoVector.add(left);
                }
                if (inputMap["d"]) {
                    let right = taxi.getDirection(BABYLON.Axis.X).scale(velocidad);
                    movimientoVector = movimientoVector.add(right);
                }

                // APLICAR MOVIMIENTO (Respetando paredes)
                if (movimientoVector.length() > 0) {
                    taxi.moveWithCollisions(movimientoVector);
                }

                // LÓGICA DE INTERACCIÓN (Barra Espaciadora)
                if (inputMap[" "]) { 
                    if (pasajeroActualIdx === null) {
                        // --- INTENTAR RECOGER ---
                        for (let i = 0; i < configPasajeros.length; i++) {
                            let pData = configPasajeros[i];
                            if(pData.entregado || !pData.mesh) continue;
                            
                            // Verificar distancia
                            let dist = BABYLON.Vector3.Distance(taxi.position, pData.mesh.position);
                            if (dist < 8) {
                                pasajeroActualIdx = i;
                                pData.mesh.parent = taxi; // Parenting 
                                pData.mesh.position = new BABYLON.Vector3(0, -4, 0);
                                hazLuz.isVisible = true;
                                break; 
                            }
                        }
                    } else {
                        // --- INTENTAR ENTREGAR ---
                        let pDataActual = configPasajeros[pasajeroActualIdx];
                        let distZona = BABYLON.Vector3.Distance(taxi.position, pDataActual.zonaMesh.position);

                        if (distZona < 6) {
                            // Soltar pasajero
                            pDataActual.mesh.parent = null;
                            pDataActual.mesh.position = new BABYLON.Vector3(taxi.position.x, 0.5, taxi.position.z);
                            pDataActual.entregado = true;
                            pasajeroActualIdx = null;
                            hazLuz.isVisible = false;
                            
                            // Quitar efectos visuales
                            pDataActual.mesh.getChildMeshes().forEach(part => {
                                highlightLayer.removeMesh(part);
                            });
                            pDataActual.zonaMesh.material.emissiveColor = new BABYLON.Color3(0, 0, 0); 
                            pDataActual.zonaMesh.material.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);

                            // Actualizar Puntuación
                            contadorEntregas++; 
                            textoContador.text = `PASAJEROS\n${contadorEntregas} / ${totalPasajeros}`;
                            
                            // VERIFICAR VICTORIA
                            if (contadorEntregas === totalPasajeros) {
                                juegoTerminado = true; 
                                pantallaVictoria.isVisible = true; 
                                panelInstrucciones.isVisible = false;
                                panelContador.isVisible = false;
                                musicaHTML.pause(); 
                                musicaHTML.currentTime = 0; 
                            }
                        }
                    }
                }
            });

        return scene;
      };

      createScene().then((scene) => {
        engine.runRenderLoop(function () { scene.render(); });
      });
      window.addEventListener("resize", function () { engine.resize(); });
    </script>
  </body>
</html>
